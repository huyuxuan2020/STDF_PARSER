name: Release (auto-update)

# 正式发版：推一个 v* tag 即可同时构建 macOS + Windows，
# 自动用更新私钥签名、生成 latest.json，并发布 GitHub Release。
# 用户端 App 启动时会读取 Release 里的 latest.json 来检查更新。
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# 注意：tauri.conf.json 里的 version 要先改成与 tag 一致（去掉前缀 v）。
#
# 发布顺序（避免「包还没传完、版本却已经能被检测到」的竞态）：
#   1) create-release —— 先建一个【草稿】Release。草稿不会被
#      `releases/latest` 命中，所以此时所有用户仍只看到旧版本。
#   2) build-tauri    —— macOS / Windows 并行构建、签名，把安装包和
#      latest.json 上传到这个草稿 Release。
#   3) publish-release —— 两个平台都成功后，才把 Release 取消草稿、
#      正式发布。此刻 latest.json 与所有安装包一并对外可见，
#      用户检测到更新时安装包必定已存在，不会再下载 404。
on:
  push:
    tags:
      - "v*"
  # 也允许手动触发（需要在下面填一个已存在的 tag 名）
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v0.2.0）"
        required: true

env:
  TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # ── 1) 先建草稿 Release，输出 release_id 供后续 job 使用 ──
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      # 需要 checkout 才能读到仓库根的 RELEASE_NOTES.md。
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.TAG_NAME;
            // 面向用户的发布说明：写在仓库根的 RELEASE_NOTES.md。
            // 每次发版前更新这个文件即可，不用再改 workflow。
            const body = fs.readFileSync('RELEASE_NOTES.md', 'utf8').trim();
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `STDF Parser ${tag}`,
              body,
              draft: true,
              prerelease: false,
            });
            return data.id;

  # ── 2) 并行构建两个平台，上传到上面的草稿 Release ──
  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        if: matrix.platform == 'macos-latest'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Import Apple signing certificate
        if: matrix.platform == 'macos-latest'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install create-dmg
        if: matrix.platform == 'macos-latest'
        run: brew install create-dmg

      - name: Install DMG background dependencies
        if: matrix.platform == 'macos-latest'
        run: python3 -m pip install -r packaging/dmg/requirements.txt

      - name: Build, sign & upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # —— 自动更新签名（两个平台都需要）——
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # —— macOS 代码签名 + 公证（仅 mac 任务用到，windows 任务忽略）——
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        with:
          # 上传到上面的草稿 Release（不再各自创建 Release，避免竞态）。
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # 静态链接守卫：产物若引用 Homebrew / /usr/local 的动态库（例如
      # liblzma.5.dylib），在没装对应库的用户机器上会启动即崩——v1.0.0
      # 就是这样翻车的。此步失败则整个 job 失败，Release 停留在草稿，
      # 不会对用户可见。
      - name: Assert no external dylib references (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          BIN=$(find target/universal-apple-darwin/release/bundle/macos -path "*.app/Contents/MacOS/*" -type f | head -1)
          if [ -z "$BIN" ]; then
            echo "::error::bundled app binary not found — check the bundle path"
            exit 1
          fi
          echo "checking: $BIN"
          otool -L "$BIN"
          if otool -L "$BIN" | grep -E "/opt/homebrew|/usr/local"; then
            echo "::error::App binary links non-system dylibs and would crash on user machines"
            exit 1
          fi

      # 启动冒烟：把构建产物真正跑起来，活过 8 秒才算「打得开」。
      # 静态检查抓不到的启动即崩（缺动态库之外的资源缺失、初始化
      # panic、签名损坏）都在这里拦住；失败则 Release 停留在草稿。
      - name: Smoke-launch the built app (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          BIN=$(find target/universal-apple-darwin/release/bundle/macos -path "*.app/Contents/MacOS/*" -type f | head -1)
          echo "launching: $BIN"
          "$BIN" &
          PID=$!
          sleep 8
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::App exited within 8s of launch — it would not open on user machines"
            exit 1
          fi
          kill "$PID"

      - name: Build styled signed and notarized DMG (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_PROFILE: stdf-parser-ci
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_BUNDLE: target/universal-apple-darwin/release/bundle/macos/STDF Parser.app
          DMG_ARCH: universal
          SKIP_APP_BUILD: "1"
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_PASSWORD"
          CREATE_DMG_BIN="$(command -v create-dmg)" npm run dmg:signed
          UPDATER_DIR="target/release/bundle/final-updater"
          UPDATER_ARCHIVE="$UPDATER_DIR/STDF.Parser_universal.app.tar.gz"
          mkdir -p "$UPDATER_DIR"
          COPYFILE_DISABLE=1 tar -czf "$UPDATER_ARCHIVE" \
            -C "$(dirname "$APP_BUNDLE")" "$(basename "$APP_BUNDLE")"
          npm run tauri -- signer sign "$UPDATER_ARCHIVE"
          echo "SIGNED_DMG=target/release/bundle/dmg/STDF_Parser_${TAG_NAME#v}_universal_developer_id.dmg" >> "$GITHUB_ENV"
          echo "SIGNED_APP_ARCHIVE=$UPDATER_ARCHIVE" >> "$GITHUB_ENV"

      - name: Smoke-launch final signed app (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          BIN=$(find target/universal-apple-darwin/release/bundle/macos -path "*.app/Contents/MacOS/*" -type f | head -1)
          echo "launching final signed app: $BIN"
          "$BIN" &
          PID=$!
          sleep 8
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::Final signed app exited within 8s of launch"
            exit 1
          fi
          kill "$PID"

      - name: Upload final macOS artifacts
        if: matrix.platform == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG_NAME" \
            "$SIGNED_DMG" \
            "$SIGNED_APP_ARCHIVE" \
            "$SIGNED_APP_ARCHIVE.sig" \
            --clobber

      - name: Smoke-launch the built app (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $bin = "target/release/stdf-viewer-mac.exe"
          Write-Host "launching: $bin"
          $p = Start-Process -FilePath $bin -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            Write-Error "App exited within 8s of launch - it would not open on user machines"
            exit 1
          }
          Stop-Process -Id $p.Id -Force

  # ── 3) 两个平台都成功后，才正式发布（取消草稿）──
  publish-release:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Rebuild updater manifest with final macOS signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-manifest
          gh release download "$TAG_NAME" \
            --pattern latest.json \
            --pattern STDF.Parser_universal.app.tar.gz.sig \
            --dir release-manifest
          MAC_SIGNATURE="$(cat release-manifest/STDF.Parser_universal.app.tar.gz.sig)"
          jq --arg signature "$MAC_SIGNATURE" '
            .platforms["darwin-aarch64"].signature = $signature |
            .platforms["darwin-x86_64"].signature = $signature |
            .platforms["darwin-aarch64-app"].signature = $signature |
            .platforms["darwin-x86_64-app"].signature = $signature
          ' release-manifest/latest.json > release-manifest/latest.final.json
          mv release-manifest/latest.final.json release-manifest/latest.json
          jq -e --arg version "${TAG_NAME#v}" --arg signature "$MAC_SIGNATURE" '
            .version == $version and
            ([
              .platforms["darwin-aarch64"],
              .platforms["darwin-x86_64"],
              .platforms["darwin-aarch64-app"],
              .platforms["darwin-x86_64-app"]
            ] | all(
              .signature == $signature and
              (.url | endswith("/STDF.Parser_universal.app.tar.gz"))
            ))
          ' release-manifest/latest.json
          gh release upload "$TAG_NAME" release-manifest/latest.json --clobber

      - name: Publish release
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const tag = process.env.TAG_NAME;
            const version = tag.replace(/^v/, '');
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.release_id),
              per_page: 100,
            });
            const names = new Set(assets.map((asset) => asset.name));
            const required = [
              'latest.json',
              `STDF_Parser_${version}_universal_developer_id.dmg`,
              'STDF.Parser_universal.app.tar.gz',
              'STDF.Parser_universal.app.tar.gz.sig',
              `STDF.Parser_${version}_x64-setup.exe`,
              `STDF.Parser_${version}_x64-setup.exe.sig`,
              `STDF.Parser_${version}_x64_en-US.msi`,
              `STDF.Parser_${version}_x64_en-US.msi.sig`,
            ];
            const missing = required.filter((name) => !names.has(name));
            if (missing.length > 0) {
              throw new Error(`Refusing to publish; missing assets: ${missing.join(', ')}`);
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.release_id),
              draft: false,
              prerelease: false,
            });
